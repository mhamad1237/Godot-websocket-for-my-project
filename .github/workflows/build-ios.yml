name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7"
  GODOT_CHANNEL: "stable"
  PRESET_NAME: "iOS"     # must match the preset name in export_presets.cfg
  APP_NAME: "mohammads_fps_remake"       # name used for the exported project / scheme

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot and export templates
        run: |
          V="${GODOT_VERSION}-${GODOT_CHANNEL}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${V}_macos.universal.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv Godot.app /Applications/Godot.app
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$T"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$T/"

      - name: Import project
        run: /Applications/Godot.app/Contents/MacOS/Godot --headless --import || true

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          # Godot tries to build/sign the IPA itself and will fail without
          # signing credentials, but it generates the Xcode project first.
          /Applications/Godot.app/Contents/MacOS/Godot --headless \
            --export-release "${PRESET_NAME}" "build/ios/${APP_NAME}.ipa" || true
          ls -la build/ios
          test -d "build/ios/${APP_NAME}.xcodeproj"

      - name: Build app without code signing
        run: |
          xcodebuild \
            -project "build/ios/${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          mkdir -p out
          zip -qr "out/${APP_NAME}-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: out/*.ipa
          if-no-files-found: error
